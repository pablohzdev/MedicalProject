<body class="bg-background min-h-screen flex flex-col items-center justify-center p-md font-body-md text-on-background">
<!-- Top Navigation (Shell suppressed for Login as per mandate) -->
<main class="w-full max-w-md">
<!-- Brand Identity Container -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-xl mb-md">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="health_and_safety">health_and_safety</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Lumina Health</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Acceso al Sistema Médico</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-sm">
<form class="space-y-lg" id="loginForm">
<!-- Select Physician -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="doctorSelect">
                        Seleccionar Médico
                    </label>
<div class="relative">
<select class="w-full bg-white border border-outline rounded-lg px-md py-sm font-body-md text-on-surface appearance-none focus:ring-2 focus:ring-primary focus:ring-opacity-20 focus:border-primary transition-all" id="doctorSelect" name="doctor" required="">
<option disabled="" selected="" value="">Elija su perfil...</option>
<option value="dr_richardson">Dr. Richardson</option>
<option value="dra_garcia">Dra. García</option>
<option value="dr_smith">Dr. Smith</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Password (Placeholder for visual completeness) -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">
                        Contraseña
                    </label>
<input class="w-full bg-white border border-outline rounded-lg px-md py-sm font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:ring-opacity-20 focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-sm rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-sm" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
<!-- Support Links -->
<div class="pt-md text-center">
<a class="text-primary font-label-md text-label-md hover:underline" href="#">¿Olvidó su contraseña?</a>
</div>
</form>
</div>
<!-- Visual Context Image -->
<div class="mt-xxl grid grid-cols-1 gap-md">
<div class="relative h-48 rounded-xl overflow-hidden grayscale opacity-40">
<img alt="Hospital Hallway" class="w-full h-full object-cover" data-alt="A bright, high-key photograph of a sterile and modern hospital corridor with polished floors reflecting soft overhead lighting. The color palette is dominated by clean whites and light slates, maintaining a professional and clinical atmosphere. In the background, there is a soft blur of a nurse station, conveying a sense of organized activity. The lighting is bright and airy, representing a safe and technologically advanced medical environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkTFb3lmmE0Zwr82T1R3H8EupA9nNrSWYBXjbCT8g8KwZo3FW7ANiukKdWstCiKwI6flVI8uD7M9dH18EZQcCg6Rr1_h_0nFhGYZySZTQbWa4ox2uxYxs2ibc87T5abcRSE2fCbgJi5A9yY9R-Sv2bnE3UDQWNxv9AxBVMqVZrwAe_QqNbRWqwFRqyWvvueY3c5JdzXT4kD02Z3gUEB7o4fogFuMOE2paA8cJVPX6RX5JjH1s5o87UCRz79LqaeCf4_aLS3a80XQg"/>
</div>

</main>
<footer class="mt-auto py-lg text-center">
<p class="font-body-sm text-body-sm text-outline">
            © 2024 Lumina Health System. Todos los derechos reservados.
        </p>
</footer>
<script>
        // Form Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const doctorId = document.getElementById('doctorSelect').value;
            if (doctorId) {
                // Simulation of localStorage persistence
                localStorage.setItem('medicoId', doctorId);
                localStorage.setItem('medicoName', document.getElementById('doctorSelect').options[document.getElementById('doctorSelect').selectedIndex].text);
                
                // Redirect to dashboard (as requested)
                window.location.href = 'index2.html';
            }
        });
    </script>
