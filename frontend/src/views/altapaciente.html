<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lumina Health - Alta de Paciente</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/tailwind.config.js"></script>
    <script>
      tailwind.config = tailwindConfig;
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="/src/js/components/navbar.js"></script>
  </head>
  <body class="font-body-md text-body-md antialiased">
    <header class="bg-surface docked full-width top-0 border-b border-outline-variant z-50 sticky">
      <div id="navbar-container"></div>
    </header>

    <main class="max-w-container-max mx-auto px-lg py-xl">
      <!-- Breadcrumb & Header Section -->
      <div class="mb-xl">
        <h1 class="font-display text-display text-on-surface">
          Nuevo Registro de Paciente
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-xs">
          Complete todos los campos requeridos para ingresar al paciente en el sistema clínico.
        </p>
      </div>

      <!-- Registration Form -->
      <form id="form-paciente" class="grid">
        <!-- Main Form Canvas -->
        <div class="col-span-12 lg:col-span-9 flex flex-col gap-gutter">

          <!-- Section 1: Datos Personales -->
          <section class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant" id="personal">
            <div class="flex items-center gap-sm mb-lg border-b border-surface-container-high pb-sm">
              <span class="material-symbols-outlined text-primary">person</span>
              <h2 class="font-headline-md text-headline-md text-on-surface">Datos Personales</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-lg">

              <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant" for="nombre">
                  Nombre <span class="text-error">*</span>
                </label>
                <input
                  class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all"
                  id="nombre" name="nombre" placeholder="Ej. Carlos" type="text" required
                />
              </div>

              <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant" for="apellidos">
                  Apellidos <span class="text-error">*</span>
                </label>
                <input
                  class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all"
                  id="apellidos" name="apellidos" placeholder="Ej. García López" type="text" required
                />
              </div>

              <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant" for="fecha_nacimiento">
                  Fecha de Nacimiento
                </label>
                <input
                  class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all"
                  id="fecha_nacimiento" name="fecha_nacimiento" type="date"
                />
              </div>

              <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant" for="genero">
                  Género
                </label>
                <select
                  class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all"
                  id="genero" name="genero"
                >
                  <option value="">Seleccione una opción</option>
                  <option value="masculino">Masculino</option>
                  <option value="femenino">Femenino</option>
                  <option value="otro">Otro</option>
                  <option value="no-binario">No binario</option>
                </select>
              </div>

              <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant" for="grupo_sanguineo">
                  Grupo sanguíneo
                </label>
                <select
                  class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all"
                  id="grupo_sanguineo" name="grupo_sanguineo"
                >
                  <option value="">Seleccione una opción</option>
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                  <option value="O+">O+</option>
                  <option value="O-">O-</option>
                  <option value="desconocido">Desconocido</option>
                </select>
              </div>

            </div>
          </section>

          <!-- Section 2: Antecedentes Médicos -->
          <section class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant" id="medico">
            <div class="flex items-center gap-sm mb-lg border-b border-surface-container-high pb-sm">
              <span class="material-symbols-outlined text-primary">clinical_notes</span>
              <h2 class="font-headline-md text-headline-md text-on-surface">Antecedentes Médicos</h2>
            </div>
            <div class="flex flex-col gap-lg">
              <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant" for="observaciones">
                  Observaciones Clínicas
                </label>
                <textarea
                  class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all"
                  id="observaciones" name="observaciones"
                  placeholder="Notas adicionales sobre condiciones preexistentes, cirugías previas o tratamientos actuales."
                  rows="4"
                ></textarea>
              </div>
            </div>
          </section>

          <!-- Form Action Buttons -->
          <div class="flex justify-center items-center gap-md py-lg mt-sm border-t border-outline-variant">
            <button
              class="px-xl py-md rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-all"
              type="button"
              onclick="window.location.href = '/src/views/pacientes.html'"
            >
              Cancelar
            </button>
            <button
              class="bg-primary text-on-primary px-xl py-md rounded-lg font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all flex items-center gap-sm shadow-md"
              type="submit"
            >
              <span class="material-symbols-outlined">how_to_reg</span>
              Registrar Paciente
            </button>
          </div>

        </div>
      </form>
    </main>

    <script src="/src/js/services/api.js"></script>
    <script>
      document.getElementById('form-paciente').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Recolectar valores
        const nombre = document.getElementById('nombre').value.trim();
        const apellidos = document.getElementById('apellidos').value.trim();
        const fecha_nacimiento = document.getElementById('fecha_nacimiento').value || null;
        const genero = document.getElementById('genero').value || null;
        const grupo_sanguineo = document.getElementById('grupo_sanguineo').value || null;
        const antecedentes = document.getElementById('observaciones').value.trim() || null;

        // Validar campos requeridos
        if (!nombre || !apellidos) {
          alert('Por favor complete el nombre y apellidos del paciente');
          return;
        }

        // Concatenar nombre completo
        const nombreCompleto = `${nombre} ${apellidos}`;

        const payload = {
          nombre: nombreCompleto,
          fecha_nacimiento: fecha_nacimiento,
          genero: genero,
          grupo_sanguineo: grupo_sanguineo,
          antecedentes: antecedentes
        };

        try {
          const result = await postData('/pacientes', payload);

          if (result) {
            alert(`✅ Paciente registrado exitosamente con ID: ${result.paciente_id}`);
            window.location.href = '/src/views/pacientes.html';
          }
        } catch (error) {
          console.error('Error al registrar paciente:', error);
          alert('Error al registrar el paciente. Por favor intente de nuevo.');
        }
      });
    </script>

  </body>
</html>
