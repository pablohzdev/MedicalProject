<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lumina Health | Patient History</title>

    <!-- 1. Tailwind CDN primero -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- 2. Tu config después -->
    <script src="/tailwind.config.js"></script>
    <!-- 3. Asignar la config -->
    <script>
      tailwind.config = tailwindConfig;
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="/src/js/components/navbar.js"></script>
  </head>
  <body class="bg-surface text-on-surface font-body-md">

    <!-- TopNavBar -->
    <header class="bg-surface docked full-width top-0 border-b border-outline-variant z-50 sticky">
      <div id="navbar-container"></div>
    </header>

    <div class="flex min-h-screen">
      <!-- SideNavBar (placeholder) -->

      <!-- Main Content Canvas -->
      <main class="flex-1 ml-0 bg-surface p-lg">
        <div class="max-w-container-max mx-auto flex flex-col gap-gutter">

          <!-- Patient Summary Header -->
          <section class="bg-surface-container-lowest p-xl rounded-xl border border-outline-variant flex flex-col lg:flex-row justify-between gap-xl">
            <div class="flex items-start gap-xl">
              <div class="w-24 h-24 rounded-2xl bg-primary-container flex items-center justify-center text-on-primary-container">
                <span class="material-symbols-outlined text-[48px]">person</span>
              </div>
              <div class="flex flex-col gap-xs">
                <h1 id="paciente-nombre" class="font-display text-display text-on-surface">—</h1>
                <div class="flex flex-wrap gap-md mt-sm">
                  <span id="paciente-id" class="bg-surface-container px-md py-xs rounded-full font-data-mono text-body-sm text-on-surface-variant border border-outline-variant">
                    ID: —
                  </span>
                  <span id="paciente-nacimiento" class="bg-surface-container px-md py-xs rounded-full font-body-sm text-on-surface-variant border border-outline-variant">
                    —
                  </span>
                  <span id="paciente-sangre" class="bg-error-container text-on-error-container px-md py-xs rounded-full font-bold text-body-sm">
                    —
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- Grid: Timeline + Sidebar -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">

            <!-- Left: Medical History Timeline -->
            <div class="lg:col-span-8 flex flex-col gap-lg">

              <!-- Header + Button -->
              <div class="flex flex-wrap gap-md items-center justify-between">
                <div class="flex items-center gap-md">
                  <h2 class="font-headline-lg text-headline-lg text-on-surface">Historial Médico</h2>
                  <button id="btn-nueva-cita" class="px-md py-sm rounded-lg bg-secondary text-on-secondary font-label-md flex items-center gap-xs hover:opacity-90 transition-all shadow-sm active:scale-95">
                    <span class="material-symbols-outlined text-[18px]">add_circle</span>
                    Nueva Cita
                  </button>
                </div>
              </div>

              <!-- Timeline -->
              <div id="timeline" class="relative space-y-md before:absolute before:inset-0 before:ml-5 before:-translate-x-px before:h-full before:w-0.5 before:bg-gradient-to-b before:from-primary before:via-outline-variant before:to-transparent">
                <p class="text-on-surface-variant text-body-md pl-md">Cargando historial...</p>
              </div>
            </div>
            <!-- FIN Left col -->

            <!-- Right: Clinical Trends Sidebar -->
            <div class="lg:col-span-4 flex flex-col gap-lg">
              <h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Resumen Clínico</h2>

              <!-- Medications -->
              <div class="bg-surface-container-lowest p-lg rounded-xl border border-outline-variant shadow-sm">
                <div class="flex items-center justify-between mb-md">
                  <div class="flex items-center gap-sm">
                    <span class="material-symbols-outlined text-primary">pill</span>
                    <h2 class="font-headline-md text-on-surface">Medicamentos</h2>
                  </div>
                </div>
                <div id="sidebar-medicamentos" class="space-y-md">
                  <p class="text-body-sm text-on-surface-variant">Cargando...</p>
                </div>
              </div>

              <!-- Clinical Insights -->
              <div class="bg-surface-container-high p-lg rounded-xl border border-outline-variant">
                <h4 class="font-headline-md text-on-surface mb-md">Información Clínica</h4>
                <div class="flex flex-col gap-sm">
                  <div class="flex items-center gap-md p-sm bg-surface-container-lowest rounded-lg border border-outline-variant">
                    <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1">pill</span>
                    <div>
                      <p class="font-label-md text-on-surface">Prescripciones activas</p>
                      <p id="sidebar-total-medicamentos" class="text-body-sm text-on-surface-variant">—</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-md p-sm bg-surface-container-lowest rounded-lg border border-outline-variant">
                    <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1">history</span>
                    <div>
                      <p class="font-label-md text-on-surface">Total de consultas</p>
                      <p id="sidebar-total-consultas" class="text-body-sm text-on-surface-variant">—</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-md p-sm bg-surface-container-lowest rounded-lg border border-outline-variant">
                    <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1">warning</span>
                    <div>
                      <p class="font-label-md text-on-surface">Antecedentes</p>
                      <p id="sidebar-antecedentes" class="text-body-sm text-on-surface-variant">—</p>
                    </div>
                  </div>
                </div>
              </div>

            </div>
            <!-- FIN Right col -->

          </div>
          <!-- FIN grid -->

        </div>
      </main>
    </div>

  <script src="/src/js/services/api.js"></script>
  <script>
    const params     = new URLSearchParams(window.location.search);
    const pacienteId = params.get('pacienteId');

    if (!pacienteId) window.location.href = '/src/views/pacientes.html';

    document.getElementById('btn-nueva-cita').addEventListener('click', () => {
      window.location.href = `/src/views/consulta.html?pacienteId=${pacienteId}`;
    });

    // ── Formatear fecha ISO → "14 Mar, 2024" ──
    function formatFecha(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('es-MX', {
        day: '2-digit', month: 'short', year: 'numeric'
      });
    }

    // ── Renderizar un item del timeline ──
    function renderConsulta(consulta, esReciente) {
      const dotColor  = esReciente ? 'bg-primary ring-primary' : 'bg-outline-variant ring-outline-variant';
      const fechaColor = esReciente ? 'text-primary' : 'text-on-surface-variant';

      const tratamientosHTML = consulta.tratamientos.length
        ? `<div class="mt-md space-y-sm">
            ${consulta.tratamientos.map(t => `
              <div class="flex items-center gap-sm p-sm bg-surface-container rounded-lg border border-outline-variant">
                <span class="material-symbols-outlined text-primary text-[18px]">pill</span>
                <div>
                  <p class="font-label-md text-on-surface">${t.medicamento} — ${t.dosis}</p>
                  <p class="text-body-sm text-on-surface-variant">${t.duracion_dias} días${t.motivo_tratamiento ? ' · ' + t.motivo_tratamiento : ''}</p>
                </div>
              </div>`).join('')}
           </div>`
        : '';

      return `
        <div class="relative flex items-start gap-lg ml-md">
          <div class="absolute -left-md mt-1.5 h-4 w-4 rounded-full border-4 border-surface ${dotColor}"></div>
          <div class="flex-1 bg-surface-container-lowest p-lg rounded-xl border border-outline-variant shadow-sm hover:border-primary transition-colors">
            <div class="flex justify-between items-start mb-sm">
              <div>
                <p class="font-data-mono ${fechaColor} font-bold text-body-sm">${formatFecha(consulta.fecha)}</p>
                <h3 class="font-headline-md text-headline-md text-on-surface mt-xs">${consulta.motivo_consulta}</h3>
              </div>
              <span class="bg-surface-variant text-on-surface-variant px-sm py-xs rounded font-label-md">Consulta #${consulta.id}</span>
            </div>
            <p class="text-on-surface-variant text-body-md leading-relaxed">${consulta.diagnostico}</p>
            ${tratamientosHTML}
          </div>
        </div>`;
    }

    // ── Cargar paciente ──
    async function cargarPaciente() {
      try {
        const p = await fetchData(`/pacientes/${pacienteId}`);
        document.title = `Lumina Health | ${p.nombre}`;
        document.getElementById('paciente-nombre').textContent      = p.nombre;
        document.getElementById('paciente-id').textContent          = `ID: PA-${String(p.id).padStart(4, '0')}`;
        document.getElementById('paciente-nacimiento').textContent  = p.fecha_nacimiento ?? '—';
        document.getElementById('paciente-sangre').textContent      = `Tipo: ${p.grupo_sanguineo ?? '—'}`;
        document.getElementById('sidebar-antecedentes').textContent = p.antecedentes ?? 'Sin antecedentes';
      } catch (e) {
        console.error('Error cargando paciente:', e);
      }
    }

    // ── Cargar historial ──
    async function cargarHistorial() {
      const timeline = document.getElementById('timeline');
      try {
        const consultas = await fetchData(`/pacientes/${pacienteId}/historial`);

        if (!consultas.length) {
          timeline.innerHTML = `<p class="text-on-surface-variant text-body-md pl-md">Sin consultas registradas.</p>`;
          document.getElementById('sidebar-medicamentos').innerHTML        = `<p class="text-body-sm text-on-surface-variant">Sin medicamentos.</p>`;
          document.getElementById('sidebar-total-consultas').textContent   = '0 consultas';
          document.getElementById('sidebar-total-medicamentos').textContent = '0 medicamentos';
          return;
        }

        // Timeline
        timeline.innerHTML = consultas
          .map((c, i) => renderConsulta(c, i === 0))
          .join('');

        // Sidebar — todos los tratamientos de todas las consultas
        const todosTratamientos = consultas.flatMap(c => c.tratamientos);

        document.getElementById('sidebar-total-consultas').textContent   = `${consultas.length} consulta${consultas.length !== 1 ? 's' : ''}`;
        document.getElementById('sidebar-total-medicamentos').textContent = `${todosTratamientos.length} medicamento${todosTratamientos.length !== 1 ? 's' : ''}`;

        document.getElementById('sidebar-medicamentos').innerHTML = todosTratamientos.length
          ? todosTratamientos.map(t => `
              <div class="pb-md border-b border-outline-variant last:border-0 last:pb-0">
                <p class="font-bold text-on-surface">${t.medicamento}</p>
                <p class="text-body-sm text-on-surface-variant">${t.dosis} — ${t.duracion_dias} días</p>
                ${t.fecha_registro ? `<p class="text-body-sm text-outline mt-xs">Registrado: ${formatFecha(t.fecha_registro)}</p>` : ''}
              </div>`).join('')
          : `<p class="text-body-sm text-on-surface-variant">Sin medicamentos registrados.</p>`;

      } catch (e) {
        console.error('Error cargando historial:', e);
        timeline.innerHTML = `<p class="text-error text-body-md pl-md">Error al cargar el historial.</p>`;
      }
    }

    cargarPaciente();
    cargarHistorial();
  </script>
  </body>
</html>
