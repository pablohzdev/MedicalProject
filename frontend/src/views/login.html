<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lumina Health - Acceso al Sistema</title>

    <link

        rel="stylesheet" />

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {

                        "outline": "#737686",

                        "secondary-fixed": "#dde1ff",

                        "on-error": "#ffffff",

                        "secondary": "#3755c3",
                        "surface-tint": "#0053db",
                        "on-tertiary-fixed": "#360f00",
                        "tertiary": "#943700",
                        "surface-dim": "#cbdbf5",
                        "surface-bright": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-primary": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "tertiary-container": "#bc4800",
                        "surface": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-surface-variant": "#434655",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed": "#00174b",
                        "on-secondary-fixed": "#001453",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#213145",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "primary": "#004ac6",
                        "background": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "on-secondary-fixed-variant": "#173bab",
                        "secondary-container": "#708cfd",
                        "on-background": "#0b1c30",
                        "tertiary-fixed": "#ffdbcd",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-secondary-container": "#00217a",
                        "surface-container-low": "#eff4ff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#003ea8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    "spacing": {

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background min-h-screen flex flex-col items-center justify-center p-md font-body-md text-on-background">
    <!-- Top Navigation (Shell suppressed for Login as per mandate) -->
    <main class="w-full max-w-md">
        <!-- Brand Identity Container -->
        <div class="text-center mb-xl">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-xl mb-md">
                <span class="material-symbols-outlined text-on-primary text-4xl"
                    data-icon="health_and_safety">health_and_safety</span>
            </div>
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Lumina Health</h1>
            <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Acceso al Sistema Médico</p>
        </div>
        <!-- Login Card -->
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-sm">
            <form class="space-y-lg" id="loginForm">
                <!-- Select Physician -->
                <div class="space-y-sm">
                    <label class="block font-label-md text-label-md text-on-surface" for="doctorSelect">
                        Seleccionar Médico
                    </label>
                    <div class="relative">
                        <select
                            class="w-full bg-white border border-outline rounded-lg px-md py-sm font-body-md text-on-surface appearance-none focus:ring-2 focus:ring-primary focus:ring-opacity-20 focus:border-primary transition-all"
                            id="doctorSelect" name="doctor" required="">
                            <option value="dra_garcia">Dr. Carlos Mendoza</option>
                        </select>
                    </div>
                </div>
                <!-- Password (Placeholder for visual completeness) -->
                <div class="space-y-sm">
                    <label class="block font-label-md text-label-md text-on-surface" for="password">
                        Contraseña
                    </label>
                    <input
                        class="w-full bg-white border border-outline rounded-lg px-md py-sm font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:ring-opacity-20 focus:border-primary transition-all"
                        id="password" name="password" placeholder="••••••••" required="" type="password" />
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-sm rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-sm"
                    type="submit">
                    <span>Entrar</span>
                    <span class="material-symbols-outlined" data-icon="login">login</span>
                </button>

            </form>
        </div>
        <!-- Visual Context Image -->
    </main>
    <footer class="mt-auto py-lg text-center">
        <p class="font-body-sm text-body-sm text-outline">
            © 2024 Lumina Health System. Todos los derechos reservados.
        </p>
    </footer>
    <script>
        // Form Logic
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const doctorId = document.getElementById('doctorSelect').value;
            if (doctorId) {
                // Simulation of localStorage persistence
                localStorage.setItem('medicoId', doctorId);
                localStorage.setItem('medicoName', document.getElementById('doctorSelect').options[document.getElementById('doctorSelect').selectedIndex].text);

                // Redirect to dashboard (as requested)
                window.location.href = 'index.html';
            }
        });
    </script>
</body>

</html>
